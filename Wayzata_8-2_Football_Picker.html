<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wayzata Football 8-2</title>

<!-- Favicon -->
<link rel="icon" type="image/png" href="wayzata_logo.png">

<style>
  :root {
    --wayzata-blue: #002B5C;
    --wayzata-gold: #FFC72C;
    --white: #FFFFFF;
  }

  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background-color: var(--wayzata-blue);
    color: var(--white);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    border: 6px solid var(--wayzata-gold);
  }

  .logo {
    margin-top: 30px;
    width: 260px;
    max-width: 70%;
    height: auto;
    display: block;
  }

  h1 {
    font-size: 2.8em;
    color: var(--wayzata-gold);
    margin: 20px 0 40px 0;
    text-shadow: 2px 2px 4px #000;
    text-align: center;
  }

  .button {
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--wayzata-gold);
    color: var(--wayzata-blue);
    font-size: 1.6em;
    font-weight: bold;
    padding: 18px 30px;
    margin: 15px auto;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    width: 80%;
    max-width: 420px;
    transition: background-color 0.3s ease, transform 0.2s ease;
  }

  .button:hover, .button:focus {
    background-color: #e6b800;
    transform: scale(1.05);
  }

  .button svg {
    width: 32px;
    height: 32px;
    margin-right: 15px;
    fill: var(--wayzata-blue);
  }

  footer {
    margin-top: auto;
    padding: 25px 10px;
    text-align: center;
    font-size: 1.2em;
  }

  footer a {
    color: var(--wayzata-gold);
    text-decoration: none;
    font-weight: bold;
  }

  footer a:hover {
    text-decoration: underline;
  }

  @media (max-width: 768px) {
    h1 {
      font-size: 2.2em;
    }
    .button {
      font-size: 1.3em;
      padding: 15px 25px;
    }
    footer {
      font-size: 1.1em;
    }
  }

  @media (max-width: 480px) {
    h1 {
      font-size: 1.8em;
    }
    .button {
      font-size: 1.2em;
      padding: 12px 20px;
    }
    footer {
      font-size: 1em;
    }
  }
</style>

<script>
  function trackClick(label) {
    console.log("Button clicked:", label);
  }
</script>

</head>
<body>

  <h1>Wayzata Football 8-2</h1>

  <!-- Roster -->
  <button class="button" onclick="trackClick('Roster'); location.href='Wayzata_8-2_Football_Roster.html';">
    <svg viewBox="0 0 24 24">
      <path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v2h20v-2c0-3.3-6.7-5-10-5z"/>
    </svg>
    Roster
  </button>

  <!-- YouTube -->
  <button class="button" onclick="trackClick('YouTube'); location.href='https://www.youtube.com/playlist?list=PLfaaqlXpSDm8';">
    <svg viewBox="0 0 24 24">
      <path d="M10 15l5.2-3-5.2-3v6zm12-3c0 2.5-.2 5.5-.2 5.5s-.2 3-2 4.2c-1.8 1.2-4.2 1.2-5.2 1.3-7.3.5-12-.5-12-.5s-3-.2-4.2-2c-1.2-1.8-1.2-4.2-1.3-5.2C-.5 7.8.5 3.1.5 3.1s.2-3 2-4.2C4.3-2.3 6.7-2.3 7.7-2.2c7.3.5 12 .5 12 .5s3 .2 4.2 2c1.2 1.8 1.2 4.2 1.3 5.2.5 7.3-.5 12-.5 12z"/>
    </svg>
    YouTube Channel
  </button>

  <!-- Crossbar -->
  <button class="button" onclick="trackClick('Games'); location.href='Wayzata_8-2_Football_Schedule.html';">
    <svg viewBox="0 0 24 24">
      <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/>
    </svg>
    Crossbar
  </button>

  <!-- Rules -->
  <button class="button" onclick="trackClick('Rules'); location.href='https://www.lmaa.org/page/show/75299-rules';">
    <svg viewBox="0 0 24 24">
      <path d="M6 2h9l5 5v15H6c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2zm8 7h5l-5-5v5z"/>
    </svg>
    Rules
  </button>

  <footer>
    <a href="https://gobound.com/mn/mshsl/fb/2026-27/wayzata/v">
      2026 Wayzata Varsity Football Schedule
    </a>
  </footer>
<script>
window.addEventListener("load", () => {
    requestAnimationFrame(() => {
        window.scrollTo(0, 0);
    });
});
</script>

</body>
</html>
